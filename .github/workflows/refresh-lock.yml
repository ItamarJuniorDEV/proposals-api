name: Refresh Composer Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Refresh PHPUnit dependencies
        run: composer update phpunit/phpunit --with-all-dependencies --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Audit refreshed lockfile
        run: composer audit --locked --no-interaction

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: atualizar dependências de teste"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
