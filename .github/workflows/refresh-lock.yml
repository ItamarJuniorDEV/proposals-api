name: Refresh Composer Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Refresh PHPUnit dependencies
        run: composer update phpunit/phpunit --with-all-dependencies --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Audit refreshed lockfile
        run: composer audit --locked --no-interaction

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-composer-lock
          path: composer.lock
          if-no-files-found: error
